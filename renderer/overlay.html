<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Select region</title>
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/urbanist/index.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      font-family: "Urbanist Variable", "Segoe UI", system-ui, sans-serif;
    }
    body { background: rgba(10, 7, 9, 0.42); }
    body.has-sel { background: rgba(0, 0, 0, 0.01); }
    body.mode-window { cursor: pointer; }

    #sel {
      position: absolute;
      display: none;
      border: 2px solid #f0566b;
      box-shadow: 0 0 0 9999px rgba(10, 7, 9, 0.48);
    }
    body.has-sel #sel { display: block; }
    body.mode-window #sel { border-radius: 8px; background: rgba(240, 86, 107, 0.08); transition: left .08s, top .08s, width .08s, height .08s; }

    #size {
      position: absolute;
      display: none;
      padding: 5px 9px;
      border-radius: 7px;
      background: #f0566b;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      max-width: 520px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #size small { font-weight: 500; opacity: 0.85; margin-left: 6px; }
    body.has-sel #size { display: block; }

    .guide { position: absolute; background: rgba(240, 86, 107, 0.55); pointer-events: none; }
    #gx { left: 0; right: 0; height: 1px; }
    #gy { top: 0; bottom: 0; width: 1px; }
    body.dragging .guide, body.away .guide, body.mode-window .guide { display: none; }

    #hint {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(20, 17, 19, 0.92);
      border: 1px solid rgba(240, 86, 107, 0.35);
      color: #ece7ea;
      font-size: 14px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
    }
    #hint b { color: #fff; font-weight: 700; }
    #hint kbd {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
      padding: 3px 6px;
      margin: 0 2px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.12);
    }
    body.dragging #hint { opacity: 0; }
  </style>
</head>
<body class="away">
  <div class="guide" id="gx"></div>
  <div class="guide" id="gy"></div>
  <div id="sel"></div>
  <div id="size"></div>
  <div id="hint"></div>
  <script src="../node_modules/jquery/dist/jquery.min.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
